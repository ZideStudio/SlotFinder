name: Docker Build

on:
  push:
    branches:
      - "renovate/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  merge_group:
    branches: ["main", "develop"]
  workflow_call:
    inputs:
      base_ref:
        description: 'Base SHA for change detection (used when called via workflow_call)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  detect-changes:
    name: Detect Docker Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for docker file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ inputs.base_ref }}
          filters: |
            docker:
              - 'docker-compose.dev.yml'
              - 'docker/**'
              - 'front/Dockerfile'
              - 'back/Dockerfile'
              - '.github/workflows/docker-build.yml'

  build:
    name: Docker Development Compose Build
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Development Docker Compose
        run: docker compose -f docker-compose.dev.yml build
