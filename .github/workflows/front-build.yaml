name: Front Build

on:
  push:
    branches:
      - "renovate/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  merge_group:
    branches: ["main", "develop"]
  workflow_call:
    inputs:
      base_ref:
        description: "Base SHA for change detection (used when called via workflow_call)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: front-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  FRONT_FOLDER: ./front

jobs:
  detect-changes:
    name: Detect Front/Back Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      front-changes: ${{ steps.filter.outputs.front }}
      front-storybook-changes: ${{ steps.filter.outputs.front-storybook }}
      back-changes: ${{ steps.filter.outputs.back }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for front/back file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ inputs.base_ref }}
          filters: |
            front:
              - "front/**"
              - ".mise.toml"
              - ".github/workflows/front-build.yaml"
              - ".github/actions/setup-node/**"
              - "Makefile"
            front-storybook:
              - "front/src/ui/**"
              - ".mise.toml"
              - ".github/workflows/front-build.yaml"
              - ".github/actions/setup-node/**"
              - "Makefile"
            back:
              - "back/**"

  install:
    name: Front Install package
    needs: detect-changes
    if: needs.detect-changes.outputs.front-changes == 'true' || needs.detect-changes.outputs.back-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Check package-lock.json
        working-directory: ${{ env.FRONT_FOLDER }}
        run: npm run package:check

      - name: Install package
        working-directory: ${{ env.FRONT_FOLDER }}
        run: npm ci

  lint:
    name: Front Lint code
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.front-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run lint
        working-directory: ${{ env.FRONT_FOLDER }}
        run: npm run lint

  test:
    name: Front Test
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.front-changes == 'true' || needs.detect-changes.outputs.back-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run Playwright install
        working-directory: ${{ env.FRONT_FOLDER }}
        run: npx playwright install

      - name: Run test
        working-directory: ${{ env.FRONT_FOLDER }}
        run: npm run test

  build:
    name: Front Build
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.front-changes == 'true' || needs.detect-changes.outputs.back-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run build
        working-directory: ${{ env.FRONT_FOLDER }}
        run: npm run build

  storybook-build:
    name: Front Build Storybook
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.front-storybook-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run build
        working-directory: ${{ env.FRONT_FOLDER }}
        run: npm run build:storybook

  chromatic:
    name: Run Chromatic
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.front-storybook-changes == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop') || ((github.event_name == 'push' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            ui:
              - 'front/src/ui/**'
      - name: Setup Node
        if: steps.changes.outputs.ui == 'true'
        uses: ./.github/actions/setup-node
      - name: Run Chromatic
        if: steps.changes.outputs.ui == 'true'
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18
        with:
          buildScriptName: "build:storybook"
          workingDir: "front"
          onlyChanged: false
          zip: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: "develop"
