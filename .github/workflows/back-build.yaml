name: Back Build

on:
  push:
    branches:
      - "renovate/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  merge_group:
    branches: ["main", "develop"]
  workflow_call:
    inputs:
      base_ref:
        description: 'Base SHA for change detection (used when called via workflow_call)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: back-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  BACK_FOLDER: ./back

jobs:
  detect-changes:
    name: Detect Back Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      back: ${{ steps.filter.outputs.back }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for back file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ inputs.base_ref }}
          filters: |
            back:
              - 'back/**'
              - '.mise.toml'
              - '.github/workflows/back-build.yaml'
              - '.github/actions/setup-go/**'
              - 'Makefile'

  install:
    name: Back Install dependencies
    needs: detect-changes
    if: needs.detect-changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install dependencies
        working-directory: ${{ env.BACK_FOLDER }}
        run: go mod download

  lint:
    name: Back Lint code
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run vet
        working-directory: ${{ env.BACK_FOLDER }}
        run: go vet ./...

  test:
    name: Back Test
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: slotfinder
          POSTGRES_USER: slotfinder
          POSTGRES_PASSWORD: slotfinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run tests
        working-directory: ${{ env.BACK_FOLDER }}
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: slotfinder
          DB_PASSWORD: slotfinder
          DB_NAME: slotfinder
        run: go test -v ./... -race -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic

      - name: Show coverage report
        working-directory: ${{ env.BACK_FOLDER }}
        run: go tool cover -func=coverage.txt

  build:
    name: Back Build
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Build
        working-directory: ${{ env.BACK_FOLDER }}
        run: go build -v ./...

  swaggo:
    name: Back Check Swagger documentation build
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger documentation
        working-directory: ${{ env.BACK_FOLDER }}
        run: |
          go tool swag init
          sed -i '/LeftDelim/d; /RightDelim/d' docs/docs.go
